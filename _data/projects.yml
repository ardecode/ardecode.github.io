# Projects shown on /projects.html, in display order.
# featured: true shows it on the homepage (keep it to 3).
# Each entry: title, summary, features (list), tags (list), links (list of label + url).

- title: "MCP Server for NetBox"
  featured: true
  summary: "NetBox has all the datacenter data. This MCP server lets Claude query it, so you can ask about clusters, devices, interfaces or IPs in plain English instead of clicking through the UI."
  features:
    - "Exposes NetBox to Claude through the Model Context Protocol"
    - "Covers clusters, devices, IPs, interfaces and config data"
    - "Plain-English questions, answers from live NetBox data"
  tags: [AI, LLM, Agents, MCP, NetBox]
  links:
    - label: GitHub
      url: "https://github.com/ardecode/netbox-mcp-server"

- title: "The India Brief"
  featured: true
  summary: "A daily podcast on Indian news that runs on its own. It scrapes Indian news sites, scores the stories, picks the top ones across politics, business, tech and sports, and turns them into a conversation with NotebookLM. Then it goes up on Spotify."
  features:
    - "Scrapers for several Indian news outlets"
    - "Categorizes and scores articles to pick the day's top stories"
    - "NotebookLM turns the stories into a conversational episode"
    - "Publishing to Spotify is automated too"
  tags: [Python, NotebookLM, Web Scraping, NLP, Spotify API]
  links:
    - label: Spotify
      url: "https://open.spotify.com/show/1fQMe3YRzi6n8L8DQoiY0T"

- title: "Sanchaari: Transparent AI Assistant"
  summary: "Most assistants just give you an answer. Sanchaari also shows how it got there, step by step, so you can see how the LLM reasons through each request."
  features:
    - "Shows the LLM's reasoning for every task"
    - "Calculations, Wikipedia search, world time, stock prices (Alpha Vantage), definitions, news and translation"
    - "Calls Wikipedia, financial and news APIs live"
  tags: [Python, LangChain, LLM]
  links:
    - label: Live Demo
      url: "https://huggingface.co/spaces/arde0909/sanchaari"
    - label: GitHub
      url: "https://github.com/ardecode/sanchaari"

