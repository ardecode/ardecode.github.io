- title: "StockAverager: Portfolio Calculator"
  summary: "If I buy more shares at this price, what's my new average? And what's my profit or loss if the price moves? This answers both, with live prices."
  features:
    - "Live prices from the Yahoo Finance API"
    - "New average price from what you hold plus what you plan to buy"
    - "Profit/loss scenarios for percentage moves in price"
    - "Hosted on Vercel"
  tags: [Next.js, React, Tailwind CSS, Yahoo Finance API, Vercel]
  links:
    - label: Live Demo
      url: "https://stock-avg-calculator.vercel.app/"
    - label: GitHub
      url: "https://github.com/ardecode/stock_avg_calculator"

- title: "AP Elections 2024 Analytics Dashboard"
  featured: true
  summary: "A Grafana dashboard on the 2024 Andhra Pradesh Assembly Elections, backed by PostgreSQL. Voting patterns, candidates and constituency results across every district of AP."
  features:
    - "EVM vs postal ballots across all 175 constituencies, by party and region"
    - "Closest contests (top 10 margins), seat share by region and party performance"
    - "Candidates: criminal records, declared assets (how many crorepatis), education and gender split by party"
    - "Filters for district and constituency"
  tags: [Grafana, PostgreSQL, SQL, Data Visualization, Election Analysis]
  links:
    - label: Live Demo
      url: "https://antarjaalasanchaari.grafana.net/public-dashboards/13236b744de24f61b0241238bc2364d2"
    - label: GitHub
      url: "https://github.com/ardecode/Andhra-Pradesh-2024-Assembly-Elections"

