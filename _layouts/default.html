<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R4RV9SMHSY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R4RV9SMHSY');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="logo">Arijit Desai</a>
      <div class="nav-links">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} class="active"{% endif %}>Blog</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#travel' | relative_url }}">Travel</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>&copy; {{ site.time | date: "%Y" }} Arijit Desai</span>
      <span>
        <a href="{{ '/blog/' | relative_url }}">Blog</a> &middot;
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a> &middot;
        <a href="https://github.com/ardecode" target="_blank" rel="noopener">GitHub</a> &middot;
        <a href="https://linkedin.com/in/arijitdesai" target="_blank" rel="noopener">LinkedIn</a>
      </span>
    </div>
  </footer>
</body>
</html>
